name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check src scripts tests
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: Keyword retrieval evaluation and site build on the committed data
        run: make index-bm25 web
